<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>
</head>
<body>

    <form action="#" method="post">

        <input type="text"
               name="fullname"
               placeholder="Full name"
               required
               minlength="3"
               maxlength="30">
        <br><br>

        <input type="email"
               name="email"
               placeholder="you@college.edu"
               pattern="[a-zA-Z0-9._%+-]+@college\.edu"
               required>
        <br><br>

        <input type="tel"
               name="mobile"
               placeholder="10-digit mobile"
               pattern="[0-9]{10}"
               required>
        <br><br>

        <input type="number"
               name="age"
               placeholder="Age"
               min="16"
               max="30"
               required>
        <br><br>

        <input type="password"
               name="password"
               placeholder="Password"
               minlength="8"
               maxlength="20"
               required>
        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ABC College Admission 2026</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
        }

        .container {
            width: 80%;
            margin: auto;
            border: 1px solid lightgreen;
            padding: 20px;
        }

        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 5px;
        }

        main {
            width: 70%;
            margin: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid silver;
            padding: 5px;
        }

        th {
            background-color: #e8e8f5;
        }

        fieldset {
            margin-top: 15px;
        }

        input, select, textarea {
            margin-bottom: 12px;
        }

        footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 5px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>

        <h2>Courses and Fees</h2>

        <table>
            <caption>Available Courses</caption>

            <tr>
                <th>Course</th>
                <th>Seats</th>
                <th>Fees</th>
            </tr>

            <tr>
                <td>B.Tech CSE</td>
                <td>120</td>
                <td>₹90,000</td>
            </tr>

            <tr>
                <td>BCA</td>
                <td>60</td>
                <td>₹45,000</td>
            </tr>
        </table>

        <form>
            <fieldset>
                <legend>Application Form</legend>

                <label for="name">Name:</label>
                <br>
                <input type="text" id="name" required>
                <br>

                <label for="email">Email:</label>
                <br>
                <input type="email" id="email" required>
                <br>

                <label for="course">Course:</label>
                <br>

                <select id="course">
                    <option>B.Tech CSE</option>
                    <option>BCA</option>
                </select>

                <br>

                <label for="statement">Statement:</label>
                <br>

                <textarea id="statement"
                          rows="4"
                          cols="40"></textarea>

                <br>

                <button type="submit">Apply</button>

            </fieldset>
        </form>

    </main>

    <footer>
        &copy; 2026 ABC College
    </footer>

</div>

</body>
</html>
